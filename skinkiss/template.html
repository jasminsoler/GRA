<!-- =====================================================
     SHOP DROPDOWN
     Desktop: CSS hover
     Mobile: tap/click
===================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    const shopToggle =
        document.querySelector(".shop-toggle");


    const shopDropdown =
        document.querySelector(".dropdown");


    if (!shopToggle || !shopDropdown) {

        return;

    }



    /* =========================================
       TAP / CLICK SHOP
    ========================================== */

    shopToggle.addEventListener("click", function (event) {


        event.preventDefault();


        const isOpen =
            shopDropdown.classList.toggle("open");


        shopToggle.setAttribute(
            "aria-expanded",
            isOpen
        );


    });



    /* =========================================
       CLOSE DROPDOWN WHEN CLICKING ELSEWHERE
    ========================================== */

    document.addEventListener("click", function (event) {


        if (!shopDropdown.contains(event.target)) {


            shopDropdown.classList.remove("open");


            shopToggle.setAttribute(
                "aria-expanded",
                "false"
            );


        }

    });



    /* =========================================
       CLOSE DROPDOWN WITH ESCAPE KEY
    ========================================== */

    document.addEventListener("keydown", function (event) {


        if (event.key === "Escape") {


            shopDropdown.classList.remove("open");


            shopToggle.setAttribute(
                "aria-expanded",
                "false"
            );


        }

    });


});

</script>
