<style id="skin-kiss-click-only-dropdown-fix">
/* SHOP DROPDOWN — CLICK/TAP ONLY */
.dropdown {
    position: relative;
}

.dropdown:not(.open) .dropdown-menu {
    display: none !important;
}

.dropdown.open .dropdown-menu {
    display: flex !important;
}

/* Disable the old hover behavior completely */
.dropdown:hover .dropdown-menu {
    display: none !important;
}

.dropdown.open:hover .dropdown-menu {
    display: flex !important;
}

.shop-dropdown-toggle {
    appearance: none;
    border: none;
    background: transparent;
    color: #4a1f2d;
    font-family: "Montserrat", sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    cursor: pointer;
    transition: color 0.3s ease;
}

.shop-dropdown-toggle:hover {
    color: #e75885;
}

@media (max-width: 900px) {
    .dropdown-menu {
        position: static;
        transform: none;
        width: 210px;
        margin: 10px auto 0;
        border-radius: 18px;
    }
}
</style>

<!-- =====================================================
     SHOP DROPDOWN JAVASCRIPT

     CLICK / TAP ONLY

     The dropdown does NOT use CSS hover.
===================================================== -->





<!-- =====================================================
     SHOP DROPDOWN JAVASCRIPT
     CLICK / TAP ONLY
===================================================== -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    const dropdown = document.querySelector(".dropdown");
    const toggle = document.querySelector(".shop-dropdown-toggle");

    if (!dropdown || !toggle) {
        return;
    }

    toggle.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        const isOpen = dropdown.classList.toggle("open");

        toggle.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
        );
    });

    document.addEventListener("click", function (event) {

        if (!dropdown.contains(event.target)) {

            dropdown.classList.remove("open");

            toggle.setAttribute(
                "aria-expanded",
                "false"
            );
        }
    });

    document.addEventListener("keydown", function (event) {

        if (event.key === "Escape") {

            dropdown.classList.remove("open");

            toggle.setAttribute(
                "aria-expanded",
                "false"
            );
        }
    });

    const dropdownLinks =
        dropdown.querySelectorAll(".dropdown-menu a");

    dropdownLinks.forEach(function (link) {

        link.addEventListener("click", function () {

            dropdown.classList.remove("open");

            toggle.setAttribute(
                "aria-expanded",
                "false"
            );
        });
    });

});
</script>
